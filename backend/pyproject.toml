[project]
name = "veyro-backend"
version = "0.1.0"
requires-python = ">=3.13"
# psycopg: PostgreSQL driver for the GOV-01-R02 tenant-isolation/authn harness
# (raw SQL as distinct DB roles). Also SQLAlchemy 2's `postgresql+psycopg`
# dialect driver, so the TSD reference stack can adopt it later unchanged.
dependencies = [
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

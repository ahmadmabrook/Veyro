      - name: Android UI-test applicability (N/A only while no Android app/screen source exists)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/head"
          hits="$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -Ev '^(knowledge|veyro-product-experience-design|\.github|\.claude|contracts|tools)/' \
            | grep -E '^mobile/android/|\.kt$|\.kts$|\.gradle$|(^|/)AndroidManifest\.xml$' \
            || true)"
          if [[ -z "$hits" ]]; then
            echo "mobile-android-applicability: NOT_APPLICABLE (no Android app/screen source). No Compose UI-test result exists and none is claimed."
            exit 0
          fi
          printf '%s\n' "$hits" | head -20
          echo "DENY: Android source exists but no runnable Compose UI-test harness is wired; wire one before this job may pass" >&2
          exit 1

  mobile-ios-applicability:

        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DENY: head sha is not 40-hex" >&2; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9_.-]+$ && "${HEAD_REPO#*/}" != "." && "${HEAD_REPO#*/}" != ".." ]] \
            || { echo "DENY: head repo is not a safe owner/repo slug" >&2; exit 1; }
          REPO_URL="${SERVER_URL}/${HEAD_REPO}.git"
          git init -q "$RUNNER_TEMP/head"
          git -C "$RUNNER_TEMP/head" fetch -q --no-tags --depth=1 "$REPO_URL" "$HEAD_SHA"
          git -C "$RUNNER_TEMP/head" -c advice.detachedHead=false checkout -q FETCH_HEAD
          [[ "$(git -C "$RUNNER_TEMP/head" rev-parse HEAD)" == "$HEAD_SHA" ]] \
            || { echo "DENY: checkout is not $HEAD_SHA" >&2; exit 1; }

      - name: Assert CPython 3.13 interpreter, create venv, hash-enforced install of the lock
        shell: bash
        run: |
          set -euo pipefail
          head="$RUNNER_TEMP/head"
          assert="$head/tools/assert_ci_python313.py"
          lock="$head/backend/requirements-typecheck-linux-x86_64-cp313.lock.txt"
          for f in "$assert" "$lock"; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "DENY: $f is not a regular file" >&2; exit 1; }
          done
          shopt -s nullglob
          candidates=()
          if found="$(command -v python3.13)"; then candidates+=("$found"); fi
          candidates+=(/usr/bin/python3.13 /usr/local/bin/python3.13)
          candidates+=(/opt/hostedtoolcache/Python/3.13.*/x64/bin/python3.13)
          chosen=""
          for cand in "${candidates[@]}"; do
            [[ -f "$cand" && -x "$cand" ]] || continue
            if "$cand" -I "$assert"; then chosen="$cand"; break; fi
          done
          [[ -n "$chosen" ]] || { echo "DENY: no CPython 3.13 linux-x86_64 interpreter; no fallback" >&2; exit 1; }
          "$chosen" -m venv "$RUNNER_TEMP/venv"
          for v in $(compgen -e); do case "$v" in PIP_*) unset "$v" ;; esac; done
          export PIP_CONFIG_FILE=/dev/null
          "$RUNNER_TEMP/venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: --no-deps \
            --index-url https://pypi.org/simple \
            --no-cache-dir --no-input --disable-pip-version-check \
            -r "$lock"

      - name: Run the blocking deterministic regression command (observed local result is FAIL)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/head"
          script=knowledge/05-QA/tools/run_regression.py
          [[ -f "$script" && ! -L "$script" ]] || { echo "DENY: $script absent" >&2; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" "$script"

  e2e-applicability:
    name: e2e-applicability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch pinned head commit (tokenless, public repository)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DENY: head sha is not 40-hex" >&2; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9_.-]+$ && "${HEAD_REPO#*/}" != "." && "${HEAD_REPO#*/}" != ".." ]] \
            || { echo "DENY: head repo is not a safe owner/repo slug" >&2; exit 1; }
          REPO_URL="${SERVER_URL}/${HEAD_REPO}.git"
          git init -q "$RUNNER_TEMP/head"
          git -C "$RUNNER_TEMP/head" fetch -q --no-tags --depth=1 "$REPO_URL" "$HEAD_SHA"
          git -C "$RUNNER_TEMP/head" -c advice.detachedHead=false checkout -q FETCH_HEAD

      - name: E2E applicability (N/A only while no user-visible app source exists)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/head"
          # Product source only: governance docs, the design bundle, CI and agent config are not app source.
          hits="$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -Ev '^(knowledge|veyro-product-experience-design|\.github|\.claude|contracts|tools)/' \
            | grep -E '^(web|apps?|frontend|admin)/|\.(tsx|jsx|vue|svelte)$|(^|/)(next|vite|nuxt|svelte)\.config\.[cm]?[jt]s$' \
            || true)"
          if [[ -z "$hits" ]]; then
            echo "e2e-applicability: NOT_APPLICABLE (no user-visible web/app source in this commit). No E2E result exists and none is claimed."
            exit 0
          fi
          printf '%s\n' "$hits" | head -20
          echo "DENY: user-visible app source exists but no runnable E2E harness is wired; wire one before this job may pass" >&2
          exit 1

  mobile-android-applicability:

# GOV-01-R04 - mandatory blocking type-check CI CANDIDATE (MOD-001, epoch
# MOD001-20261013-FRESH-1). INERT: authored, never run, never enabled.
#
# What this is: the smallest separate workflow that runs the CAP-012 scoped
# wrapper tools/run_scoped_mypy.py against the REAL fetched backend/app, shaped
# so that it could become a genuine required PR gate after a separate CI-scope
# Opus assurance. It is NOT that gate today.
#
# Why it is inert: the only trigger is a push to the branch named below, which
# does not exist and must not be created for this candidate. There is no
# pull_request, pull_request_target, workflow_dispatch, schedule or
# workflow_run trigger and no default-branch or wildcard branch trigger. The
# first step additionally denies any run whose event is not push or whose ref
# is not exactly that branch.
#
# Trust boundary (BUG-061; designed and tested here, NOT active). A naive
# `pull_request` activation takes the workflow definition from the PR head, so
# a PR could rewrite this file (or the wrapper, or the mypy config) and turn
# its own check green. The candidate is therefore built around two shas that
# are separate inputs even though the inert push trigger feeds both from
# github.sha:
#   - TRUSTED_SHA: the base. Under a future `pull_request_target` on main, the
#     definition and GITHUB_SHA come from the default branch, never from the
#     PR. Everything executed or trusted as configuration - this workflow's
#     steps, tools/run_scoped_mypy.py, tools/assert_ci_python313.py, the
#     cp313 lock, backend/pyproject.toml (the [tool.mypy] table, which could
#     otherwise load a plugin) - comes from a checkout of TRUSTED_SHA.
#   - SOURCE_SHA: the PR head. It supplies ONE inert input: the bytes of the
#     Python sources to be type-checked, i.e. the backend/app blobs and every
#     other .py/.pyi under backend/ (the wrapper resolves imports against
#     backend/, so those are the in-repository modules mypy can follow). It is
#     fetched into a bare object store, never checked out, and each blob is
#     screened (mode 100644 blob only, no symlink/gitlink/executable, safe
#     path) and written as data into the trusted tree. Nothing from SOURCE_SHA
#     is executed, imported, installed or placed on a search path.
#   - Followed-module composition (BUG-064): in the composed tree every .py and
#     .pyi under backend/ is the SOURCE_SHA entry. Trusted copies outside
#     backend/app are removed and the source ones written (additions,
#     modifications and deletions alike), and the result is verified against the
#     source listing; there is no fallback to trusted bytes for a followed
#     module. Anything under backend/ that is a symlink or gitlink, a .py/.pyi
#     that is not a plain 100644 blob, or a path under backend/.venv denies the
#     job. Non-Python files under backend/ keep their trusted bytes (mypy does
#     not read them), except that the gate-defining paths named above must be equal.
#   - Tamper deny: the SOURCE_SHA copies of this workflow, the wrapper, the
#     assertion script, the lock, backend/pyproject.toml and the other mypy
#     config-discovery files must be byte- and mode-identical to the trusted
#     entries (absent on both sides counts as equal). A PR that edits any of
#     them fails its own check instead of landing a weakened gate; changing
#     them takes a separate reviewed default-branch change.
# Switching it on is NOT done here. It needs, at minimum: replacing the
# trigger with `pull_request_target` (types opened/synchronize/reopened,
# branches main), allowing event `pull_request_target`, setting SOURCE_SHA to
# the PR head sha, extending the test allowlist for that one expression, and
# landing the result on main first (a PR cannot bootstrap its own gate).
#
# Design, in order: deny unless push to the candidate branch; fetch the
# trusted sha tokenlessly and prove HEAD equals it, fetch the source sha into a
# bare store and prove it is that commit; regular-file, non-symlink and
# pinned-SHA-256 checks on the wrapper, the interpreter assertion script and
# the Linux cp313 lock in the trusted tree; tamper deny and inert
# materialization of the source backend/app and backend/ modules; resolve a CPython 3.13
# linux-x86_64 64-bit interpreter with tools/assert_ci_python313.py (deny,
# never fall back to python3); venv from it with the bundled, unupgraded pip;
# hash-enforced install of the lock only (--require-hashes --only-binary=:all:
# --no-deps); then ONE invocation of the wrapper, with a cleared environment,
# on the composed tree. mypy is never invoked directly; the wrapper owns the
# one allowlisted mypy command. Only wrapper rc 0 plus its exact success
# markers passes: rc 1 (type errors) and rc 2 (denial) both fail the job, as
# does every other code.
#
# Constraints held by construction:
#   - No action references (no CAP-approved action exists; see
#     `.claude/rules/infra/iac.md` control 5). Plain runner-image tooling only.
#   - No secret references; `permissions: {}`; tokenless fetches (public repo).
#   - Untrusted values reach shell only through `env:`, never interpolated into
#     a script body. The one inline Python reads them from argv.
#   - Nothing is installed or fetched outside the pinned lock. No other
#     artifact, cache, download or upload step exists.
#   - Nothing is written to the composed tree except the screened source
#     .py/.pyi blobs under backend/ (app included) and one symlink,
#     backend/.venv -> the pinned venv, which the wrapper requires and never
#     walks. The only deletions are the trusted .py/.pyi under backend/, which
#     the source blobs replace.
#
# NOT claimed:
#   - NO GATE CREDIT. CAP-012 is independently approved for BOUNDED LOCAL use
#     only (wrapper SHA-256 pinned below); it is NOT approved for CI use. This
#     file is not a required status check, not GOV-01-R04's non-bypassable
#     gate, and a green run of it would still be no gate PASS until a separate
#     CI-scope assurance approves it and a pinned head/run/log is inspected.
#   - The local real-source scoped run (rc 0, 25 files) is a QA record, not CI
#     evidence about these bytes.
#   - ACTIVATION WORK THAT IS NOT DONE: (1) the pull_request_target trigger and
#     event allowance above; (2) the fork-PR fetch - a fork head sha may be
#     reachable in the base repository only via refs/pull/N/head, which a bare
#     sha fetch might not be served, and the local file:// fixtures cannot
#     establish it; a throwaway-fork dry run must precede any required check;
#     (3) the required-status-check setting and same-name check-run spoofing
#     proof, which are repository settings outside this file; (4) a public
#     repository is assumed for the tokenless fetches; (5) CI-scope assurance
#     of the composed design and of CAP-012 for CI use.
#   - KNOWN RESIDUALS: the wrapper follows imports from backend/app into other
#     in-repository modules under backend/; the composed tree now carries the
#     PR head's bytes for all of them (BUG-064), but a PR edit that changes
#     what mypy resolves from outside backend/ (installed packages, the lock)
#     is out of scope. The composition is head-as-is: a PR not rebased onto the
#     trusted sha has its older copy of a newer trusted module checked. An
#     emptied directory may remain after a deleted package (mypy and the
#     wrapper treat it like an absent one). A symlink or gitlink anywhere
#     under backend/, or an executable-mode .py/.pyi, denies the job even if it
#     is unrelated to the import closure. Crafted source could still stress mypy itself (bounded by timeout-minutes). That
#     mypy never executes analysed source and that inline comments cannot load
#     plugins is not independently re-verified here.
#   - The hash pins below must be re-derived (and the static test updated)
#     whenever the pinned file legitimately changes; a stale pin fails closed.

name: typecheck-required-candidate

on:
  push:
    branches:
      - candidate-only/typecheck-required-never-created

permissions: {}

jobs:
  typecheck-required-candidate:
    name: typecheck-required-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Deny unless candidate-only ref; fetch trusted checkout and source objects (tokenless, public repository)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRUSTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "push" ]] || { echo "DENY: event is not push" >&2; exit 1; }
          [[ "$REF" == "refs/heads/candidate-only/typecheck-required-never-created" ]] \
            || { echo "DENY: ref is not the candidate-only branch" >&2; exit 1; }
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DENY: trusted sha is not 40-hex" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "DENY: source sha is not 40-hex" >&2; exit 1; }
          work="$RUNNER_TEMP/work"
          src="$RUNNER_TEMP/source.git"
          git init -q "$work"
          git -C "$work" fetch -q --no-tags --depth=1 "$REPO_URL" "$TRUSTED_SHA"
          git -C "$work" -c advice.detachedHead=false checkout -q FETCH_HEAD
          [[ "$(git -C "$work" rev-parse HEAD)" == "$TRUSTED_SHA" ]] \
            || { echo "DENY: trusted checkout is not $TRUSTED_SHA" >&2; exit 1; }
          git init -q --bare "$src"
          git -C "$src" fetch -q --no-tags --depth=1 "$REPO_URL" "$SOURCE_SHA"
          [[ "$(git -C "$src" rev-parse "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]] \
            || { echo "DENY: source objects are not commit $SOURCE_SHA" >&2; exit 1; }
          echo "trusted sha: $TRUSTED_SHA"
          echo "source sha (inert backend/app input only): $SOURCE_SHA"
          echo "CANDIDATE ONLY - NO GATE CREDIT: CAP-012 is bounded-local approved, not approved for CI use."

      - name: Guard pinned inputs (regular file, not a symlink, exact SHA-256)
        env:
          WRAPPER_SHA256: 1a5df02b6c0ddd69a90c46adb62c81e3adb0b2ba162484fa2180b14ec665399c
          ASSERT_SHA256: ea51c067d5d75ff2ba1bb7602e37a0a5c88f9908a18c40d957d65b825a4a3d9c
          LOCK_SHA256: 5e7596d408190a6103ffe1e3988f1c88ea33a34306302cc7de6f0570340e95de
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          check() {
            local path="$1" want="$2" got
            [[ -e "$path" ]] || { echo "DENY: $path absent" >&2; exit 1; }
            [[ ! -L "$path" ]] || { echo "DENY: $path is a symlink" >&2; exit 1; }
            [[ -f "$path" ]] || { echo "DENY: $path is not a regular file" >&2; exit 1; }
            got="$(sha256sum "$path" | cut -d' ' -f1)"
            [[ "$got" == "$want" ]] || { echo "DENY: $path sha256 $got, expected $want" >&2; exit 1; }
            echo "pinned ok: $want $path"
          }
          check "$work/tools/run_scoped_mypy.py" "$WRAPPER_SHA256"
          check "$work/tools/assert_ci_python313.py" "$ASSERT_SHA256"
          check "$work/backend/requirements-typecheck-linux-x86_64-cp313.lock.txt" "$LOCK_SHA256"
          [[ -d "$work/backend/app" && ! -L "$work/backend/app" ]] \
            || { echo "DENY: backend/app is not a real directory" >&2; exit 1; }
          [[ -f "$work/backend/pyproject.toml" && ! -L "$work/backend/pyproject.toml" ]] \
            || { echo "DENY: backend/pyproject.toml is not a regular file" >&2; exit 1; }
          [[ ! -e "$work/backend/.venv" && ! -L "$work/backend/.venv" ]] \
            || { echo "DENY: backend/.venv is committed in the trusted tree" >&2; exit 1; }

      - name: Deny candidate tamper; materialize source backend/app and backend/ modules as inert data
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deny() { echo "DENY: $1" >&2; exit 1; }
          work="$RUNNER_TEMP/work"
          src="$RUNNER_TEMP/source.git"
          stage="$RUNNER_TEMP/source-app"
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "trusted sha is not 40-hex"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "source sha is not 40-hex"
          [[ "$(git -C "$work" rev-parse HEAD)" == "$TRUSTED_SHA" ]] || deny "trusted tree is not $TRUSTED_SHA"
          [[ "$(git -C "$src" rev-parse "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]] \
            || deny "source objects are not commit $SOURCE_SHA"

          # Tamper deny: mode, type and object id of each gate-defining path
          # must match the trusted entry; absent on both sides is equal.
          for rel in \
            .github/workflows/typecheck-required-candidate.yml \
            tools/run_scoped_mypy.py \
            tools/assert_ci_python313.py \
            backend/requirements-typecheck-linux-x86_64-cp313.lock.txt \
            backend/pyproject.toml backend/mypy.ini backend/.mypy.ini backend/setup.cfg backend/tox.ini
          do
            want="$(git -C "$work" ls-tree --full-tree "$TRUSTED_SHA" -- "$rel")"
            got="$(git -C "$src" ls-tree --full-tree "$SOURCE_SHA" -- "$rel")"
            [[ "$got" == "$want" ]] \
              || deny "candidate changed $rel; gate bytes must come from the reviewed trusted sha"
          done

          # Source backend/app: blobs only, screened, written as data.
          git -C "$src" ls-tree -r -z --full-tree "$SOURCE_SHA" -- backend/app > "$RUNNER_TEMP/app.lst"
          [[ -s "$RUNNER_TEMP/app.lst" ]] || deny "source has no backend/app entries"
          rm -rf "$stage"
          mkdir -p "$stage"
          count=0
          while IFS= read -r -d '' rec; do
            meta="${rec%%$'\t'*}"
            path="${rec#*$'\t'}"
            read -r mode type oid <<<"$meta"
            [[ "$mode" == "100644" && "$type" == "blob" ]] \
              || deny "refused source entry mode $mode type $type at '$path' (symlink/gitlink/executable)"
            case "$path" in backend/app/?*) ;; *) deny "source entry outside backend/app: '$path'" ;; esac
            case "/$path/" in
              */../*|*/./*|*//*|*/.git/*) deny "unsafe source path '$path'" ;;
            esac
            mkdir -p "$stage/$(dirname "$path")"
            git -C "$src" cat-file blob "$oid" > "$stage/$path"
            count=$((count + 1))
          done < "$RUNNER_TEMP/app.lst"
          [[ "$count" -ge 1 ]] || deny "no source blobs materialized"

          # Followed in-repository modules outside backend/app (BUG-064). The wrapper
          # resolves imports against backend/ and mypy follows them, so every .py/.pyi
          # under backend/ outside app must be the SOURCE bytes, never the trusted
          # ones: all entries are screened and staged here, before the trusted tree is
          # touched. A symlink or gitlink anywhere under backend/, a .py/.pyi entry
          # that is not a plain 100644 blob, and anything under backend/.venv is
          # denied. Non-Python files are not read by mypy and keep their trusted bytes.
          git -C "$src" ls-tree -r -z --full-tree "$SOURCE_SHA" -- backend > "$RUNNER_TEMP/backend.lst"
          outstage="$RUNNER_TEMP/source-backend"
          rm -rf "$outstage"
          mkdir -p "$outstage"
          : > "$RUNNER_TEMP/outside.lst"
          outside=0
          while IFS= read -r -d '' rec; do
            meta="${rec%%$'\t'*}"
            path="${rec#*$'\t'}"
            read -r mode type oid <<<"$meta"
            case "$path" in backend/app|backend/app/*) continue ;; backend/?*) ;; *) deny "source entry outside backend: '$path'" ;; esac
            case "/$path/" in
              */../*|*/./*|*//*|*/.git/*|/backend/.venv/*) deny "unsafe source path '$path'" ;;
            esac
            case "$mode" in 120000|160000) deny "refused source entry mode $mode at '$path' (symlink/gitlink under backend)" ;; esac
            case "$path" in
              *.py|*.pyi)
                [[ "$mode" == "100644" && "$type" == "blob" ]] \
                  || deny "refused source module entry mode $mode type $type at '$path' (executable or irregular)"
                mkdir -p "$outstage/$(dirname "$path")"
                git -C "$src" cat-file blob "$oid" > "$outstage/$path"
                printf '%s\t%s\0' "$oid" "$path" >> "$RUNNER_TEMP/outside.lst"
                outside=$((outside + 1)) ;;
            esac
          done < "$RUNNER_TEMP/backend.lst"

          rm -rf "$work/backend/app"
          mv "$stage/backend/app" "$work/backend/app"
          [[ -z "$(find "$work/backend/app" ! -type f ! -type d)" ]] || deny "non-regular entry in materialized backend/app"
          [[ "$(find "$work/backend/app" -type f | wc -l | tr -d ' ')" == "$count" ]] \
            || deny "materialized file count differs from the source listing"
          echo "materialized $count inert source blobs from $SOURCE_SHA into the trusted $TRUSTED_SHA tree"

          # Replace every trusted .py/.pyi under backend/ outside app by the staged source
          # ones (add, modify and delete alike), then prove the result equals the source
          # listing: each placed file hashes to its source blob and no other .py/.pyi exists.
          find "$work/backend" -path "$work/backend/app" -prune -o \( -name '*.py' -o -name '*.pyi' \) \( -type f -o -type l \) -print0 > "$RUNNER_TEMP/trusted-modules.lst"
          while IFS= read -r -d '' f; do rm -f "$f"; done < "$RUNNER_TEMP/trusted-modules.lst"
          while IFS= read -r -d '' rec; do
            oid="${rec%%$'\t'*}"
            path="${rec#*$'\t'}"
            mkdir -p "$work/$(dirname "$path")"
            mv "$outstage/$path" "$work/$path"
            [[ -f "$work/$path" && ! -L "$work/$path" ]] || deny "followed module '$path' is not a regular file after composition"
            [[ "$(git -C "$work" hash-object --no-filters -- "$work/$path")" == "$oid" ]] \
              || deny "followed module '$path' is not the source blob $oid"
          done < "$RUNNER_TEMP/outside.lst"
          [[ "$(find "$work/backend" -path "$work/backend/app" -prune -o \( -name '*.py' -o -name '*.pyi' \) \( -type f -o -type l \) -print | wc -l | tr -d ' ')" == "$outside" ]] \
            || deny "composed backend/ holds .py/.pyi files that are not in the source listing"
          echo "composed $outside followed backend/ .py/.pyi modules from $SOURCE_SHA (add, modify, delete); no trusted copy remains"

      - name: Resolve and assert CPython 3.13 linux-x86_64 interpreter (deny, no fallback)
        shell: bash
        run: |
          set -euo pipefail
          assert="$RUNNER_TEMP/work/tools/assert_ci_python313.py"
          shopt -s nullglob
          candidates=()
          if found="$(command -v python3.13)"; then candidates+=("$found"); fi
          candidates+=(/usr/bin/python3.13 /usr/local/bin/python3.13)
          candidates+=(/opt/hostedtoolcache/Python/3.13.*/x64/bin/python3.13)

          chosen=""
          for cand in "${candidates[@]}"; do
            [[ -f "$cand" && -x "$cand" ]] || continue
            echo "--- candidate: $cand"
            if "$cand" -I "$assert"; then
              chosen="$cand"
              break
            fi
          done
          if [[ -z "$chosen" ]]; then
            echo "DENY: no CPython 3.13 linux-x86_64 64-bit interpreter resolvable; not falling back to default python3" >&2
            exit 1
          fi
          printf '%s\n' "$chosen" > "$RUNNER_TEMP/interpreter.path"
          echo "asserted interpreter: $chosen"

      - name: Create venv from asserted interpreter (bundled pip, not upgraded)
        shell: bash
        run: |
          set -euo pipefail
          py="$(cat "$RUNNER_TEMP/interpreter.path")"
          "$py" -m venv "$RUNNER_TEMP/venv-typecheck"
          "$RUNNER_TEMP/venv-typecheck/bin/python" -I "$RUNNER_TEMP/work/tools/assert_ci_python313.py" \
            || { echo "DENY: venv interpreter fails assertion" >&2; exit 1; }

      - name: Hash-enforced install of the Linux cp313 lock (nothing outside the lock)
        shell: bash
        run: |
          set -euo pipefail
          for v in $(compgen -e); do case "$v" in PIP_*) unset "$v" ;; esac; done
          export PIP_CONFIG_FILE=/dev/null
          lock="$RUNNER_TEMP/work/backend/requirements-typecheck-linux-x86_64-cp313.lock.txt"
          "$RUNNER_TEMP/venv-typecheck/bin/python" -m pip install \
            --require-hashes --only-binary=:all: --no-deps \
            --index-url https://pypi.org/simple \
            --no-cache-dir --no-input --disable-pip-version-check \
            -r "$lock"
          "$RUNNER_TEMP/venv-typecheck/bin/python" -m pip list --disable-pip-version-check --format=freeze

      - name: Scoped wrapper on the composed backend/app (rc 0 only; rc 1 and rc 2 fail)
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          venv="$RUNNER_TEMP/venv-typecheck"
          ln -s "$venv" "$work/backend/.venv"
          scratch="$(mktemp -d "$RUNNER_TEMP/wrapper-run.XXXXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/home" "$scratch/tmp"

          set +e
          out="$(cd "$scratch" && env -i PATH=/usr/bin:/bin HOME="$scratch/home" TMPDIR="$scratch/tmp" NO_COLOR=1 LC_ALL=C.UTF-8 \
            "$venv/bin/python" -I "$work/tools/run_scoped_mypy.py" 2>&1)"
          rc=$?
          set -e
          printf 'wrapper rc=%s\n%s\n' "$rc" "$out"
          case "$rc" in
            0) ;;
            1) echo "DENY: wrapper rc 1 - type errors reported on backend/app" >&2; exit 1 ;;
            2) echo "DENY: wrapper rc 2 - wrapper denied the run" >&2; exit 1 ;;
            *) echo "DENY: wrapper rc $rc is not an allowed outcome" >&2; exit 1 ;;
          esac
          printf '%s\n' "$out" | grep -E '^Success: no issues found in [1-9][0-9]* source files$' >/dev/null \
            || { echo "DENY: exact success diagnostic absent" >&2; exit 1; }
          printf '%s\n' "$out" | grep -E '^run_scoped_mypy: rc=0 ' >/dev/null \
            || { echo "DENY: wrapper rc=0 marker absent" >&2; exit 1; }
          if printf '%s\n' "$out" | grep -E '^DENY:' >/dev/null; then
            echo "DENY: wrapper output contains a DENY line" >&2
            exit 1
          fi
          echo "wrapper observed: rc=0 and exact success diagnostic."
          echo "CANDIDATE ONLY - NO GATE CREDIT: this is not a required check and not a GOV-01-R04 gate PASS."

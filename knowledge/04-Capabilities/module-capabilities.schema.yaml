# Schema for knowledge/01-Modules/<MOD>/module-capabilities.yaml
# One file per module, declaring exactly which registered capabilities that module depends on.
# Every capability_id referenced here MUST exist in CAPABILITY_REGISTRY.md with review_status: APPROVED
# before the module may use it for real (non-drill) work. Enforcement is manual/review-time in MOD-000;
# a future module may automate the check.

module_id: string          # e.g. MOD-000
capabilities:
  - capability_id: string  # e.g. CAP-001, must match CAPABILITY_REGISTRY.md
    used_for: string        # short description of what this module uses it for
    scope_note: string      # any module-specific scope restriction, if narrower than registry default
    required_status: APPROVED  # module may not depend on anything less than APPROVED, except during
                                # explicit qualification-drill tasks (marked separately, not here)

supply_chain_notes: string  # free text: anything unusual about where these capabilities came from,
                             # any deviation from CAPABILITY_POLICY.md default trust rules

module_id: MOD-001
status: PLANNING — NOT READY (see knowledge/03-Modules/MOD-001/STATUS.md)
applicable_capability_profiles:
  - Infra/SRE/CI (ACTIVATED — ADR-005 Decision 2; agent: veyro-infra-sre-engineer)
  - Backend (ACTIVATED, bounded — ADR-005 Decision 2; agent: veyro-backend-engineer)
  - Admin Web (DEFERRED — marker at admin-web/.profile-pending)
  - General Web (DEFERRED — marker at web/.profile-pending)
  - Front Desk/POS (DEFERRED — markers at frontdesk-web/.profile-pending and frontdesk-edge-bridge/.profile-pending)
  - KMP Mobile (DEFERRED — marker at mobile/shared/.profile-pending)
  - iOS Host (DEFERRED — marker at mobile/iosApp/.profile-pending)
  - Android Host (DEFERRED — marker at mobile/androidApp/.profile-pending)
  - Edge (DEFERRED — marker at edge/.profile-pending)
  - Data/AI (DEFERRED — marker at data-ai/.profile-pending)
# Corrected (Scenario Review round 3, P1-5): the previous version of this
# file listed only 4 of the 10 §4.3 paths (backend/**, one combined
# mobile/** marker, admin-web/**, frontdesk-web/**), leaving General
# Web, Edge, and Data/AI — none of which have a directory yet — with no
# path entry for the surface_profile_activation gate to key on, and
# collapsing KMP Mobile/iOS Host/Android Host into one marker that
# cannot express three distinct deferred profiles. Fixed: every one of
# the 10 §4.3 paths from MODEL_ROUTING.md's own table now has an entry
# below, each carrying either an activated-profile record or a named
# deferral marker — matching that table exactly, so this manifest and
# the gate it's validated against can't independently drift again.
repository_paths_surfaces:
  - path: backend/**
    profile: Backend
    state: ACTIVATED
  - path: infra/**
    profile: Infra/SRE/CI
    state: ACTIVATED
  - path: .github/workflows/**
    profile: Infra/SRE/CI
    state: ACTIVATED
  - path: admin-web/**
    profile: Admin Web
    state: DEFERRED
    marker: admin-web/.profile-pending
  - path: web/**
    profile: General Web
    state: DEFERRED
    marker: web/.profile-pending
  - path: frontdesk-web/**
    profile: Front Desk/POS
    state: DEFERRED
    marker: frontdesk-web/.profile-pending
  - path: frontdesk-edge-bridge/**
    profile: Front Desk/POS
    state: DEFERRED
    marker: frontdesk-edge-bridge/.profile-pending
  - path: mobile/shared/**
    profile: KMP Mobile
    state: DEFERRED
    marker: mobile/shared/.profile-pending
  - path: mobile/iosApp/**
    profile: iOS Host
    state: DEFERRED
    marker: mobile/iosApp/.profile-pending
  - path: mobile/androidApp/**
    profile: Android Host
    state: DEFERRED
    marker: mobile/androidApp/.profile-pending
  - path: edge/**
    profile: Edge
    state: DEFERRED
    marker: edge/.profile-pending
  - path: data-ai/**
    profile: Data/AI
    state: DEFERRED
    marker: data-ai/.profile-pending
  - path: contracts/**
    profile: null  # cross-cutting, no single §4.3 surface owns this path
    state: n/a
  - path: tools/**
    profile: null
    state: n/a
required_agent_roles:
  - role: veyro-critical-engineer
    scope: "Bounded to 3 slices per ADR-005 Decision 1: tenant-isolation/RLS harness, authn negative-credential fixture pattern, RLS+permission architecture gates (GOV-01-R02/R04)"
    model: opus
    status: "REGISTERED AND ROUTABLE (BUG-029 and BUG-030 both closed; corrected routing drill confirmed real escalation from veyro-implementer — see evidence/model-routing/ROUTING_DRILL_2026-09-14.md)"
  - role: veyro-infra-sre-engineer
    scope: "infra/**, CI workflows, observability"
    model: sonnet
    status: "REGISTERED, NOT YET REACHABLE (BUG-029 closed; BUG-031 open, Scenario Review round 6, P1-4 — named by zero escalation paths in .claude/agents/*.md, same defect class BUG-030 was; must close before real infra/** implementation begins, non-blocking for Definition of Ready since no such implementation has started)"
  - role: veyro-backend-engineer
    scope: "backend/**, bounded — excludes the critical-slice harness itself"
    model: sonnet
    status: "REGISTERED, NOT YET REACHABLE (BUG-029 closed; BUG-031 open, Scenario Review round 6, P1-4 — named by zero escalation paths in .claude/agents/*.md, same defect class BUG-030 was; must close before real backend/** implementation begins, non-blocking for Definition of Ready since no such implementation has started)"
  - role: veyro-implementer
    scope: "Routine implementation outside the above"
    model: sonnet
    status: ACTIVE (already registered, MOD-000)
  - role: veyro-lead
    scope: "Architecture/ADR decisions (this module's ADR-005)"
    model: opus
    status: ACTIVE (already registered, MOD-000)

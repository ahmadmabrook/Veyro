# Corrected (Scenario Review round 3, P1-5): the previous version of this
# file listed only 4 of the 10 §4.3 paths (backend/**, one combined
# mobile/** marker, admin-web/**, frontdesk-web/**), leaving General
# Web, Front Desk/POS's edge-bridge glob, Edge, and Data/AI — none of
# which have a directory yet (corrected, Scenario Review round 15,
# P2-3: this comment previously named only 3 of these 4 no-directory
# surfaces, omitting frontdesk-edge-bridge/**) — with no
# path entry for the surface_profile_activation gate to key on, and
# collapsing KMP Mobile/iOS Host/Android Host into one marker that
# cannot express three distinct deferred profiles. Fixed: every one of
# the 10 §4.3 paths from MODEL_ROUTING.md's own table now has an entry
# below, each carrying either an activated-profile record or a named
# deferral marker — matching that table exactly, so this manifest and
# the gate it's validated against can't independently drift again.
# Gate-7 build/toolchain carve-out (ADR-005 Decision 2 Part 3;
# IMPLEMENTATION.md §4 gate 7): applies uniformly to EVERY DEFERRED
# surface below, not just the two mobile paths that happened to carry
# a per-path comment about it through round 11 — corrected, Scenario
# Review round 13, P2-3, after that per-path-only annotation was found
# to imply (falsely) that admin-web/**, web/**, frontdesk-web/**,
# frontdesk-edge-bridge/**, mobile/iosApp/**, edge/**, and data-ai/**
# were NOT covered, when the gate's own closed extension list
# (IMPLEMENTATION.md §4 gate 7) is surface-agnostic: `.gradle.kts`,
# `.gradle`, `.xcconfig`, `Package.swift`, `Podfile`, `package.json`,
# `package-lock.json`, `gradle.properties`, `settings.gradle.kts`,
# `gradle-wrapper.properties` — under ANY still-DEFERRED surface path
# below, a file matching this list passes gate 7 citing the carve-out;
# an application-source file of that surface's own type does not.
# Corrected (Scenario Review round 14, P2-6): the two per-path carve-out
# comments this note itself says round 13 intended to generalize were
# still present on mobile/shared/** and mobile/androidApp/** below,
# preserving the asymmetric-emphasis reading round 13 meant to remove
# (2 of 8 deferred surfaces visibly annotated, 6 not). Both removed —
# this general note is now the carve-out's only annotation, uniformly.

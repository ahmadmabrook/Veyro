notes: >-
  This manifest is a planning-stage draft, not a certified module-capabilities
  row. It exists to satisfy Appendix H.1's "manifest exists before Scenario
  Review can PASS" requirement and to give MOD-001's own
  surface_profile_activation CI gate (IMPLEMENTATION.md §4) something real
  to validate against once implementation starts. See ADR-005 for the full
  reasoning behind the profile-activation split, and MODEL_ROUTING.md's

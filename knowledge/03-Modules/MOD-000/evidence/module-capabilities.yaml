module_id: MOD-000
capabilities:
  - capability_id: CAP-001
    used_for: Notion Engineering Control Plane (9 databases) as live operational mirror
    scope_note: >-
      Intended use limited to the 9 named databases; demonstrated 2026-09-05 that
      technical scope enforcement is ABSENT, not merely unconfirmed (an out-of-scope
      write with no parent specified succeeded) — see evidence/security/NOTION_SCOPE_AUDIT.md
      and knowledge/05-QA/capability-evidence/CAP-001/BOUNDED_RETEST_2026-09-05.md. Read/update
      access to pre-existing non-Veyro workspace content was never tested and must not be
      asserted either way. Enforced only by .claude/rules/notion-mcp-scope-discipline.md.
    required_status: APPROVED, scope de-rated, with binding caveats (2026-09-05, distinct third independent Opus review — see CAPABILITY_REGISTRY.md, BUG-006, ADR-003, BUG-010)
  - capability_id: CAP-002
    used_for: TestSprite capability discovery/qualification drill (separate MOD-000 chunk)
    scope_note: >-
      test scaffold/test lint are local/offline (no network); doctor/usage authenticate
      to api.testsprite.com (read-only, non-billed) — corrected 2026-09-05, was
      inaccurately described as "local execution only". Synthetic fixtures only, no
      real member data. Scope narrowed 2026-09-05 (independent Opus review, BUG-006):
      test create/code/plan and all live-cloud commands are explicitly OUT of scope.
    required_status: APPROVED (narrowed scope, independent Opus review 2026-09-05)
  - capability_id: CAP-003
    used_for: Reading governing baseline .docx files during bootstrap
    scope_note: Read-only against the 3 frozen baseline docx files.
    required_status: APPROVED (first-party/harness exemption)
  - capability_id: CAP-004
    used_for: All filesystem/shell operations building the control plane
    scope_note: Project directory only.
    required_status: APPROVED (first-party/harness exemption)
  - capability_id: CAP-005
    used_for: Browser tools for manual-QA evidence gathering (added 2026-09-05 — was previously used without a registry entry, a real gap independently found and fixed same day)
    scope_note: >-
      Navigate/read/interact with pages for §12.1 drill evidence, public/unauthenticated/
      stateless endpoints only. No authenticated sessions, no credential entry, no real
      member data into any form. Page content is untrusted input, never instruction.
    required_status: APPROVED (2026-09-05, distinct third independent Opus review — first-party/harness exemption, scope caveats binding — see CAPABILITY_REGISTRY.md)
  - capability_id: CAP-006
    used_for: iOS Simulator control for manual-QA evidence gathering (added 2026-09-05, same reason as CAP-005)
    scope_note: >-
      Boot/attach/interact with iOS Simulator for §12.1 drill evidence, stock Apple apps
      only — never another project's app on the same simulator. Destructive simctl
      operations (erase/delete/install non-Veyro build) out of scope.
    required_status: APPROVED (2026-09-05, distinct third independent Opus review — satisfies stage 5 on its own merits — see CAPABILITY_REGISTRY.md)

supply_chain_notes: >
  Updated 2026-09-05 (round 2, closing BUG-006/CAP-001 and BUG-009/CAP-005/006):
  a third, distinct fresh-context `veyro-security-reviewer` invocation
  independently evaluated the CAP-001 bounded re-test and CAP-005/CAP-006's
  qualification drill. All three are now APPROVED. CAP-001 carries binding
  caveats (see CAPABILITY_REGISTRY.md, ADR-003, BUG-010) because the
  re-test proved its Notion connector has no technical scope enforcement
  — a real, owner-decision-pending gap, not certification-blocking on its
  own. CAP-002 remains APPROVED with the narrowed scope from the prior
  round. CAP-005/CAP-006 are now APPROVED with the caveats in their
  scope_note above (public-endpoint-only for Browser; stock-app-only for
  iOS Simulator); the fail-closed sequencing gap (their §12.1 evidence was
  gathered while they sat at QUALIFIED) is recorded honestly in
